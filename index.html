<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Cracker | App Conectado (Grover API)</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131b2e;
            --primary: #00f2fe;
            --secondary: #4facfe;
            --success: #00e676;
            --error: #ff5252;
            --warning: #ffab40;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: var(--card);
            width: 100%;
            max-width: 560px;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .status-connection {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 230, 118, 0.12);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .control-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #090d16;
            border: 1px solid #2d3748;
            color: var(--primary);
            font-size: 1.3rem;
            letter-spacing: 5px;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            outline: none;
            font-weight: bold;
        }

        button.btn-small {
            background: #1e293b;
            color: var(--text);
            border: 1px solid #334155;
            padding: 0 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        button.btn-small:hover {
            background: #334155;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            margin-top: 6px;
            cursor: pointer;
        }

        button.btn-run {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: #0b0f19;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 6px;
        }

        .rands-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .rand-card {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
        }

        .rand-card.hit { border-color: var(--success); }
        .rand-card.miss { border-color: var(--error); }

        .rand-title { font-size: 0.7rem; color: var(--muted); }
        .rand-value { font-size: 1.4rem; font-weight: bold; margin: 4px 0; }
        .rand-status { font-size: 0.65rem; font-weight: 600; }

        .hit .rand-value, .hit .rand-status { color: var(--success); }
        .miss .rand-value, .miss .rand-status { color: var(--error); }

        .summary-box {
            margin-top: 20px;
            background: #090d16;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #1e293b;
            display: none;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        /* Painel de Interoperabilidade / API */
        .api-panel {
            margin-top: 20px;
            background: rgba(9, 13, 22, 0.8);
            border: 1px dashed #334155;
            border-radius: 14px;
            padding: 15px;
        }

        .api-panel h3 {
            font-size: 0.8rem;
            color: var(--warning);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .api-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-api {
            flex: 1;
            background: #1e293b;
            color: var(--primary);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-api:hover {
            background: rgba(0, 242, 254, 0.15);
        }

        .log-box {
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.72rem;
            color: var(--muted);
            background: #05080f;
            padding: 8px;
            border-radius: 8px;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>⚛️ QUANTUM CRACKER API</h1>
        <div class="status-connection">
            <span class="dot"></span>
            <span id="connStatus">Canal de Integração Ativo (Escutando Apps)</span>
        </div>
    </header>

    <div class="control-group">
        <label for="senhaInput">SENHA ALVO (8 DÍGITOS)</label>
        <div class="input-row">
            <input type="text" id="senhaInput" maxlength="8" value="12345678">
            <button class="btn-small" onclick="gerarSenhaAleatoria()">🎲 Gerar</button>
        </div>
    </div>

    <div class="control-group">
        <div class="slider-header">
            <label for="pulsosRange">PULSOS QUÂNTICOS (GROVER)</label>
            <span class="badge" id="pulsosLabel">2 Pulsos (~96.1% prob.)</span>
        </div>
        <input type="range" id="pulsosRange" min="1" max="3" value="2" oninput="atualizarSlider()">
    </div>

    <button class="btn-run" onclick="executarSimulacao('MANUAL')">⚡ EXECUTAR MEDIÇÃO QUÂNTICA</button>

    <div class="rands-grid" id="randsGrid"></div>

    <div class="summary-box" id="summaryBox">
        <div class="summary-row">
            <span>Origem do Comando:</span>
            <strong id="resOrigem" style="color: var(--warning);">MANUAL</strong>
        </div>
        <div class="summary-row">
            <span>Senha Alvo:</span>
            <strong id="resOriginal" style="letter-spacing: 3px;">--------</strong>
        </div>
        <div class="summary-row">
            <span>Colapso Medido:</span>
            <strong id="resMedida" style="letter-spacing: 3px; color: var(--primary);">--------</strong>
        </div>
        <div class="summary-row">
            <span>Precisão:</span>
            <span id="resPorcentagem" style="color: var(--success);">0%</span>
        </div>
    </div>

    <!-- PAINEL DE CONEXÃO COM OUTROS APPS -->
    <div class="api-panel">
        <h3>🔗 Integração com Outros Aplicativos</h3>
        <div class="api-actions">
            <button class="btn-api" onclick="copiarLinkDireto()">📋 Copiar Link API (URL)</button>
            <button class="btn-api" onclick="copiarJSON()">📦 Copiar Resultado JSON</button>
            <button class="btn-api" onclick="simularAppExterno()">📲 Testar App Externo</button>
        </div>
        <div class="log-box" id="apiLog">Aguardando comandos externos via URL, BroadcastChannel ou postMessage...</div>
    </div>
</div>

<script>
    // 1. CANAL DE COMUNICAÇÃO ENTRE APPS / ABAS (BroadcastChannel)
    const canalQuantico = new BroadcastChannel('quantum_cracker_channel');
    let ultimoResultadoJSON = null;

    // Inicializa os 8 cards
    const grid = document.getElementById('randsGrid');
    for (let i = 1; i <= 8; i++) {
        grid.innerHTML += `
            <div class="rand-card" id="card-${i}">
                <div class="rand-title">RAND ${i}</div>
                <div class="rand-value" id="val-${i}">?</div>
